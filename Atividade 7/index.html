<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokenpo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="container-box">
                <div class="bottom">
                    <h1>Pedra</h1><img src="https://preview.redd.it/dwayne-the-rock-johnson-eating-rocks-while-sitting-on-a-v0-z1u2q9pj2ksb1.jpg?width=1024&format=pjpg&auto=webp&s=c2297aa54adb938f0fc9ce960b09256b9d30d672" alt="" width="50"
                    href>
                </div>
                <div class="bottom">
                    <h1>Papel</h1><img src="https://media-cdn.tripadvisor.com/media/photo-s/07/1d/c3/95/rolo-de-papel-higienico.jpg" alt="" width="50">
                </div>
                <div class="bottom">
                    <h1>Tesoura</h1><img src="https://assets.sistemawbuy.com.br/arquivos/cad5cc7133685cdd8d0d7880d11cba96/produtos/67290f2bc474c/tesoura-gara-a-love-store-1-67290fe492e66.jpg" alt="" width="50">
                </div>
            </div>
        </section>
        <section>
            <div class="botoes">
                <button type ="button" onclick="escolha(1)"> 
                <img src="https://preview.redd.it/dwayne-the-rock-johnson-eating-rocks-while-sitting-on-a-v0-z1u2q9pj2ksb1.jpg?width=1024&format=pjpg&auto=webp&s=c2297aa54adb938f0fc9ce960b09256b9d30d672" 
                    alt="">Pedra</button>
                <button onclick="escolha(2)">Papel</button>
                <button onclick="escolha(3)">Tesoura</button>
            </div>
            <div class="escolhas">
                <p id="maquina"></p>
                <p id="jogador"></p>
            </div>
            <div class="resultado">
                <p id="resultado"></p>
            </div>
        </section>
    </main>
    <script src="source.js"></script>
</body>
</html>
